[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-document-qa"
version = "1.0.0"
description = "Retrieval-augmented question answering over research PDFs, with inline citations and a hand-built evaluation harness that measures hallucination."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Vineet Kumar" }]
keywords = ["rag", "retrieval-augmented-generation", "citations", "evaluation", "llm", "nlp"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Kept in lockstep with requirements.txt. requirements.txt is the pinned,
# reproducible set used to produce the numbers in eval/RESULTS.md; the ranges
# below are what the package actually needs to import.
dependencies = [
    "langchain-core>=1.5,<2",
    "langchain-text-splitters>=1.1,<2",
    "langchain-chroma>=1.1,<2",
    "chromadb>=1.5,<2",
    "pypdf>=6.0",
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
ollama = ["langchain-ollama>=1.1,<2"]
anthropic = ["langchain-anthropic>=1.5,<2"]
dev = ["pytest>=8.0"]

[project.scripts]
rag-ingest = "rag.ingest:main"
rag-query = "rag.query:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
